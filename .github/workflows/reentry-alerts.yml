name: Reentry alerts (Email)

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Enviar só um email de teste (não consulta o Firestore)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check reentry alerts
        run: node scripts/alerts/check-reentry-alerts.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.test_email) && '--test-email' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
