name: Reentry alerts (Email)

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        type: choice
        default: normal
        options:
          - normal
          - test_email
          - preview_email

permissions:
  contents: read

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check reentry alerts
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test_email" ]; then
            FLAG="--test-email"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "preview_email" ]; then
            FLAG="--preview-email"
          fi
          node scripts/alerts/check-reentry-alerts.mjs $FLAG
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
